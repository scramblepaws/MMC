name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.9.3 win64_mingw -O "${{ github.workspace }}/Qt"
          echo "QT_DIR=${{ github.workspace }}/Qt/6.9.3/mingw_64" >> $env:GITHUB_ENV

      - name: Install MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/13.1.0-rt_v11-rev1/x86_64-13.1.0-release-posix-seh-ucrt-rt_v11-rev1.7z"
          Invoke-WebRequest -Uri $url -OutFile mingw.7z
          & "C:\Program Files\7-Zip\7z.exe" x mingw.7z -o"${{ github.workspace }}/mingw" -y
          echo "MINGW_DIR=${{ github.workspace }}/mingw/mingw64/bin" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "${{ env.MINGW_DIR }};${{ env.QT_DIR }}/bin;$env:PATH"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.QT_DIR }}" `
            -DCMAKE_CXX_COMPILER="${{ env.MINGW_DIR }}/g++.exe"
          cmake --build build

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ env.MINGW_DIR }};${{ env.QT_DIR }}/bin;$env:PATH"
          cd build
          ctest --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $env:PATH = "${{ env.MINGW_DIR }};${{ env.QT_DIR }}/bin;$env:PATH"
          ./tools/package_portable.ps1 -OutputDir dist/MMC -QtDir "${{ env.QT_DIR }}" -MingwBinDir "${{ env.MINGW_DIR }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MMC-portable
          path: dist/MMC
